<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
<title id="title">Avatar felino de CalixDev</title>
<desc id="desc">Retrato felino geométrico en tres cuartos mirando hacia la derecha: cabeza negra, acentos azul eléctrico, ojo claro y hocico blanco dentro de un círculo oscuro.</desc>
<defs>
  <radialGradient id="disc" cx="48%" cy="40%" r="75%"><stop offset="0" stop-color="#142238"/><stop offset="1" stop-color="#08111F"/></radialGradient>
  <clipPath id="clip"><circle cx="200" cy="200" r="188"/></clipPath>
</defs>
<circle cx="200" cy="200" r="190" fill="url(#disc)"/>
<g clip-path="url(#clip)">
